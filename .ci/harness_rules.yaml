# harness_rules.yaml — HELIX public-repo harness gate rules.
# Read by .ci/harness_check.py (read-only / stdlib). Flat schema only:
# key -> scalar / list of strings. Parsed by PyYAML if present, else by the
# built-in minimal parser in harness_check.py. This file is in the checker's
# SELF_FILES set, so its own content never trips the forbidden/secret scans.

is_public_repo: true            # public repo -> the ignore gate treats an
                                # un-ignored sensitive path as FAIL (leak), not warn.

# Sensitive / gated / internal paths that MUST stay .gitignored so a stray
# `git add .` can never stage them onto the public repo. Each is verified by
# `git check-ignore`; all listed here are already covered by the repo .gitignore
# (gated immune-library moat + private entry docs + secrets).
sensitive_paths:
  - _gated/
  - .env
  - CLAUDE.md
  - CODE_MAP.md
  - AGENTS.md
  - docs/
  - .claude/
  - hpl_ledger.json
  - signature_pipeline/
  - attack_replays_gated/
  - 30_outputs/
  - .relay/

# Filenames that, if STAGED, fail the gate outright (secrets / key material /
# private entry docs). Catches `git add -f` of an otherwise-ignored file.
forbidden_staged_names:
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "id_rsa"
  - "id_ed25519"
  - "*.p12"
  - "*.pfx"
  - "CLAUDE.md"
  - "CODE_MAP.md"
  - "AGENTS.md"
  # --- HELIX-specific: gated immune-library MOAT + runtime ledger ---------
  # These are the .gitignore'd gated assets (disclosure-boundary policy). The
  # `ignore` gate above proves they stay ignored; these names additionally
  # hard-fail a `git add -f` that force-stages one past .gitignore. None are
  # currently tracked (verified), so this is zero-false-positive.
  - "immune_*live*.json"
  - "immune_library_*_gated*.json"
  - "*_telemetry_*.json"
  - "scoring_weights*.json"
  - "hpl_ledger.json"

# Regexes that must not appear in staged diffs or tracked files (real key
# material / service-role JWTs). Kept conservative so the gate passes on the
# known-good tree and only fires on genuine leaks.
#
# NOTE on DEV_KEY_0: hpl/src/client.rs intentionally embeds the well-known
# public Anvil/Foundry devnet account #0 key
# (0xac0974...f2ff80) — a public test key, devnet-only, never real funds.
# Do NOT add a bare 0x[0-9a-f]{64} pattern here (it would false-flag that key);
# the built-in SECRET_RX also leaves it alone. Other real keys stay in scope.
forbidden_patterns:
  - "-----BEGIN [A-Z ]*PRIVATE KEY-----"
  - "service_role[\"']?\\s*[:=]\\s*[\"']?eyJ"
  # --- HELIX-specific: hosted-RPC provider URL carrying an embedded key ----
  # A crypto project's #1 accidental-leak vector (AGENTS.md §8: no RPC URL with
  # API key in the repo). Targets provider hosts + a >=12-char path key; does
  # NOT match localhost devnet URLs (http://127.0.0.1:8545) or the public
  # helix-foundation.com site. Single-quoted YAML so backslashes stay literal.
  # Verified zero matches across tracked files.
  # NOTE (docs authors): a spelled-out placeholder like .../v3/YOUR-API-KEY is
  # >=12 url-safe chars and WILL trip this gate. When documenting RPC config,
  # use an angle-bracket placeholder — .../v3/<API_KEY> — the '<' breaks the
  # key char-class so it does not fire.
  - 'https?://[A-Za-z0-9.-]*(?:infura\.io|alchemy\.com|quiknode\.pro|quicknode\.com|ankr\.com|chainstack\.com|blastapi\.io)/[A-Za-z0-9/_-]{12,}'

# Required-content checks ("<relative file>::<regex>") — the file MUST contain
# the regex, else the gate fails. HELIX-specific: this is the ci-key-grep /
# 9ff61b7 lesson ("risk_score" vs "overall_mismatch_score" silent-0.0 drift)
# encoded at the DETERMINISTIC layer — it fires in CI's first step, before any
# torch/transformers install, so a renamed/dropped canonical scoring key trips
# a visible red BEFORE the (heavier) Python output-contract test even runs.
# Complements test_output_contract.py, does not replace it.
#
# The mismatch_detector anchor is tightened to the EMISSION site (quoted key +
# colon) rather than a bare-substring occurrence: the token appears 5x in that
# file (dataclass field, ctor, output dict), so a bare substring would still
# pass if only the emitted output key were renamed while the field name stayed.
# Anchoring to `"overall_mismatch_score":` guards the actual output surface.
# proxy_fp_test_runner.py has the token exactly once (SCORE_KEY = "..."), so a
# bare-substring anchor there already trips on any rename.
required_patterns:
  - 'mismatch_detector.py::"overall_mismatch_score"\s*:'
  - 'proxy_fp_test_runner.py::overall_mismatch_score'
