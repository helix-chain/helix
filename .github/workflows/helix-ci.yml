# HELIX CI — Regression Guard
# Version: V1.0_202604120942
# Trigger: push to main, pull requests
# Structure: single workflow → single job → multi-step
# Scope: harness gate + smoke test + proxy FP suite (no Docker, no matrix, no deploy)

name: HELIX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression-guard:
    name: Smoke + FP Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # --- Setup ---
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- Harness gate (deterministic, read-only) — fail fast, before installs ---
      - name: Harness deterministic checks (read-only)
        run: python .ci/harness_check.py all --rules .ci/harness_rules.yaml --repo .

      # --- Cache Layer 1: pip packages ---
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # --- Cache Layer 2: HuggingFace model (CodeBERT ~500MB) ---
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-codebert-base-v1
          restore-keys: |
            hf-codebert-base-

      # --- Install ---
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      # --- Test Step 0: Output data-contract regression (fast, catches field drift) ---
      - name: Output data-contract regression test
        run: make contract-test

      # --- Test Step 1: Smoke ---
      - name: Smoke test
        run: make smoke-ci

      # --- Test Step 2: Proxy FP ---
      - name: Proxy/Diamond/CREATE2 FP test
        run: make fp-proxy-ci

      # --- Failure: upload debug artifacts ---
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-reports
          path: |
            ci_smoke_report_*.json
            proxy_fp_test_report_*.json
          retention-days: 7

  # Rust crates (node/ + hpl/) are public and runnable but had no CI coverage
  # (flagged P2 in the 2026-06-14 independent review). Separate job so the
  # Python regression gate above stays untouched.
  rust-guard:
    name: Rust Guard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: rustup show && cargo --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            node/target
            hpl/target
          key: cargo-${{ runner.os }}-${{ hashFiles('node/Cargo.lock', 'hpl/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: node — fmt / clippy / test
        working-directory: node
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: hpl — fmt / clippy / test (boots node in-process)
        working-directory: hpl
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
